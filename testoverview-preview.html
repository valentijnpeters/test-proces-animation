            background:

            box-shadow:
                inset 0 1px 0 rgba(255,255,255,0.24),

                0 8px 0 rgba(2, 15, 36, 0.86),
                0 18px 30px rgba(0,0,0,0.24);
            transition: transform 0.18s ease, box-shadow 0.18s ease, border-color 0.18s ease, opacity 0.18s ease;

        .narration-button:hover,
        .narration-button:focus-visible {
            transform: translateY(-2px);
            border-color: rgba(221, 227, 236, 0.46);
            box-shadow:
                inset 0 1px 0 rgba(255,255,255,0.28),
                inset 0 -8px 14px rgba(0,0,0,0.22),
                0 8px 0 rgba(2, 15, 36, 0.86),
                0 22px 34px rgba(0,0,0,0.28),
                0 0 18px rgba(200, 208, 220, 0.16);
            outline: none;
        }

        .narration-button.is-playing {
            transform: translateY(3px);
            box-shadow:
                inset 0 1px 0 rgba(255,255,255,0.22),

                0 3px 0 rgba(2, 15, 36, 0.9),

            border-color: rgba(232, 237, 244, 0.58);
            color: #ffffff;
        }

        .narration-button.is-paused {
            border-color: rgba(255, 228, 176, 0.52);

            box-shadow:
                inset 0 1px 0 rgba(255,255,255,0.22),

        }

        .narration-button[disabled] {
            cursor: not-allowed;
            opacity: 0.42;
            filter: saturate(0.4);

                0 5px 0 rgba(2, 15, 36, 0.76),
                0 10px 16px rgba(0,0,0,0.16);
        }

        .narration-button svg {
            width: 22px;
            height: 22px;
        }

        .overview-content {
            position: relative;
            z-index: 1;
            display: grid;
            grid-template-columns: minmax(0, 1fr);
            gap: 18px;
        }

        .guide-launcher-row {
            display: flex;
            justify-content: flex-end;
            max-height: 110px;
            overflow: visible;
            opacity: 1;
            transform: translateY(0);
            margin: -4px 2px -4px;
            transition:
                max-height 0.58s ease,
                opacity 0.48s ease,
                transform 0.58s ease,
                margin 0.58s ease;
        }

        .guide-launcher-row.is-faded {
            max-height: 0;
            overflow: hidden;
            margin: 0 2px -18px;
            opacity: 0;
            pointer-events: none;
            transform: translateY(-12px);
        }

        .guide-launcher {
            position: relative;
            isolation: isolate;
            overflow: hidden;
            touch-action: manipulation;
            user-select: none;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
            display: inline-grid;
            grid-template-columns: 46px auto;
            align-items: center;
            gap: 12px;
            min-height: 64px;
            padding: 8px 18px 8px 10px;
            border: 1px solid rgba(193, 186, 125, 0.58);
            border-radius: 18px;
            cursor: pointer;
            color: #f4f0ce;
            background:
                radial-gradient(ellipse at 12% 18%, rgba(193, 186, 125, 0.2) 0 18%, transparent 19%),
                radial-gradient(ellipse at 84% 72%, rgba(8, 16, 8, 0.56) 0 25%, transparent 26%),
                linear-gradient(145deg, #59633d, #28351f 48%, #121b11 100%);
            box-shadow:
                inset 0 1px 0 rgba(243, 239, 201, 0.16),
                inset 0 -12px 20px rgba(5, 11, 5, 0.2),
                0 6px 0 #0a1109,
                0 14px 24px rgba(0,0,0,0.28);
            font: inherit;
            text-align: left;
            transition: transform 0.18s ease, border-color 0.18s ease, box-shadow 0.18s ease;
        }

        .guide-launcher::after {
            content: "";
            position: absolute;
            z-index: 0;
            left: 0;
            bottom: 0;
            width: 0;
            height: 100%;
            background: linear-gradient(90deg, rgba(113, 220, 210, 0.24), rgba(244, 207, 120, 0.34));
            box-shadow: 0 0 22px rgba(126, 232, 221, 0.2);
            pointer-events: none;
        }

        .guide-launcher > * {
            position: relative;
            z-index: 1;
        }

        .guide-launcher.is-command-centre-holding::after {
            animation: analytics-dashboard-hold-progress 5s linear forwards;
        }

        .guide-launcher.is-command-centre-holding {
            border-color: rgba(244, 224, 151, 0.92);
            animation: analytics-dashboard-hold-charge 0.55s ease-in-out infinite alternate;
        }

        .guide-launcher:hover,
        .guide-launcher:focus-visible {
            transform: translateY(-2px);
            border-color: rgba(232, 224, 161, 0.82);
            box-shadow:
                inset 0 1px 0 rgba(243, 239, 201, 0.22),
                inset 0 -12px 20px rgba(5, 11, 5, 0.18),
                0 6px 0 #0a1109,
                0 18px 28px rgba(0,0,0,0.3),
                0 0 18px rgba(166, 177, 100, 0.18);
            outline: none;
        }

        .guide-launcher:active {
            transform: translateY(3px);
            box-shadow:
                inset 0 1px 0 rgba(243, 239, 201, 0.14),
                0 2px 0 #0a1109,
                0 8px 14px rgba(0,0,0,0.25);
        }

        .guide-document-icon {
            position: relative;
            width: 34px;
            height: 42px;
            justify-self: center;
            border: 2px solid rgba(244, 239, 203, 0.92);
            border-radius: 5px 10px 5px 5px;
            background: linear-gradient(155deg, #f0eccb, #aeb58a);
            box-shadow: 3px 4px 0 rgba(6, 14, 6, 0.62);

        .guide-document-icon::before {
            content: "";
            position: absolute;

            right: -2px;
            width: 12px;
            height: 12px;
            border-left: 2px solid rgba(55, 68, 37, 0.58);
            border-bottom: 2px solid rgba(55, 68, 37, 0.58);
            border-radius: 0 8px 0 3px;
            background: #7c8959;
        }

        .guide-document-icon::after {
            content: "";
            position: absolute;
            left: 7px;
            bottom: 9px;
            width: 18px;
            height: 10px;
            border-top: 2px solid rgba(47, 61, 34, 0.66);
            border-bottom: 2px solid rgba(47, 61, 34, 0.66);
        }

        .guide-launcher-copy {
            display: grid;
            gap: 3px;
        }

        .guide-launcher-kicker {
            color: rgba(214, 208, 145, 0.84);
            font-size: 0.64rem;
            font-weight: 900;
            letter-spacing: 0.16em;
            line-height: 1;
            text-transform: uppercase;
        }

        .guide-launcher-title {
            font-family: "Bahnschrift SemiCondensed", "Trebuchet MS", sans-serif;
            font-size: 1.06rem;
            font-weight: 900;
            letter-spacing: 0.08em;
            line-height: 1.05;
            text-transform: uppercase;
        }

        .guide-modal {
            position: fixed;
            z-index: 1000;
            inset: 0;
            display: grid;
            place-items: center;
            overflow: auto;
            padding: max(22px, env(safe-area-inset-top)) max(22px, env(safe-area-inset-right)) max(22px, env(safe-area-inset-bottom)) max(22px, env(safe-area-inset-left));
            background: rgba(1, 12, 30, 0.76);
            backdrop-filter: blur(12px);
            animation: guide-backdrop-in 0.22s ease both;
        }

        .guide-modal[hidden] {
            display: none;
        }

        .guide-window {
            isolation: isolate;
            width: min(760px, calc(100vw - 44px));
            max-height: min(calc(100dvh - 44px), 780px);
            min-height: 0;
            overflow: hidden;
            display: grid;
            grid-template-rows: auto minmax(0, 1fr);

            cursor: pointer;
            font-family: "Bahnschrift SemiCondensed", "Trebuchet MS", sans-serif;
            font-size: clamp(0.84rem, 1.05vw, 0.96rem);
            font-weight: 900;
            letter-spacing: 0.05em;
            line-height: 1.14;
            text-transform: uppercase;
            transition: transform 0.18s ease, box-shadow 0.18s ease, border-color 0.18s ease;
        }

        .reason-map-node.is-case span {
            max-width: 13ch;
            overflow-wrap: anywhere;
        }

        .reason-map-node.is-case:hover,
        .reason-map-node.is-case:focus-visible {
            transform: translateY(-2px);
            border-color: rgba(255, 226, 145, 0.34);
            box-shadow:
                inset 0 1px 0 rgba(255,255,255,0.14),
                0 16px 24px rgba(0,0,0,0.2),
                0 0 18px rgba(140, 232, 255, 0.14);
            outline: none;
        }

        .reason-map-node.is-case.is-selected {
            border-color: rgba(255, 226, 145, 0.42);
            color: #fff8dd;
        }

        .reason-map-node.is-case.is-explicit {
            background:
                linear-gradient(180deg, rgba(15, 87, 141, 0.95), rgba(8, 42, 78, 0.98)),
                linear-gradient(135deg, rgba(255,255,255,0.12), rgba(255,255,255,0));
        }

        .reason-map-node.is-mindmap {
            width: 120px;
            height: 120px;
            padding: 18px;
            color: rgba(236, 246, 255, 0.9);
            font-family: "Bahnschrift SemiCondensed", "Trebuchet MS", sans-serif;
            font-size: 0.82rem;
            font-weight: 900;
            letter-spacing: 0.08em;
            line-height: 1.08;
            text-transform: uppercase;
        }

        .reason-map-branch-tail {
            display: grid;
            justify-items: center;
            gap: 12px;
            width: 100%;
        }

        .reason-map-layer-prompt {
            margin: 0;
            color: rgba(167, 239, 255, 0.78);
            font-size: 0.68rem;
            font-weight: 900;
            letter-spacing: 0.12em;
            line-height: 1.25;
            text-align: center;
            text-transform: uppercase;
        }

        .reason-map-layer-prompt[hidden],
        .reason-map-layer-roller[hidden],
        .reason-map-preview[hidden] {
            display: none !important;
        }

        .reason-map-layer-roller {
            position: relative;
            display: grid;
            place-items: center;
            width: min(100%, 180px);
            min-height: 58px;
            padding: 7px;
            border: 1px solid rgba(184, 230, 255, 0.18);
            border-radius: 18px;
            background:
                linear-gradient(180deg, rgba(11, 19, 33, 0.94), rgba(4, 10, 20, 0.98)),
                linear-gradient(135deg, rgba(255,255,255,0.12), rgba(255,255,255,0));
            box-shadow:
                inset 0 1px 0 rgba(255,255,255,0.12),
                inset 0 -10px 18px rgba(0,0,0,0.22),
                0 10px 18px rgba(0,0,0,0.2);
            overflow: hidden;
        }

        .reason-map-layer-roller::before,
        .reason-map-layer-roller::after {
            content: "";
            position: absolute;
            left: 10px;
            right: 10px;
            height: 1px;
            background: rgba(255,255,255,0.14);
            z-index: 1;
        }

        .reason-map-layer-roller::before {
            top: 12px;
        }

        .reason-map-layer-roller::after {
            bottom: 12px;
        }

        .reason-map-layer-value {
            position: relative;
            z-index: 2;
            display: grid;
            place-items: center;
            width: 100%;
            min-height: 44px;
            border: 1px solid rgba(212, 220, 230, 0.22);
            border-radius: 14px;
            color: #f6f9fd;
            font-family: "Bahnschrift SemiCondensed", "Trebuchet MS", sans-serif;
            font-size: 0.82rem;
            font-weight: 900;
            letter-spacing: 0.08em;
            text-align: center;
            text-transform: uppercase;
            background:
                linear-gradient(180deg, rgba(96, 107, 122, 0.92), rgba(29, 35, 45, 0.98)),
                linear-gradient(135deg, rgba(255,255,255,0.14), rgba(255,255,255,0));
            box-shadow:
                inset 0 1px 0 rgba(255,255,255,0.18),
                0 4px 0 rgba(16, 21, 28, 0.82);
            transition: transform 0.16s ease, opacity 0.16s ease, border-color 0.16s ease;
        }

        .reason-map-layer-roller.is-rolling .reason-map-layer-value {
            animation: reason-map-slot-flash 0.22s steps(2, end) infinite;
            border-color: rgba(167, 239, 255, 0.38);
        }

        .reason-map-layer-roller.is-settled .reason-map-layer-value {
            border-color: rgba(255, 226, 145, 0.38);
            color: #fff8df;
            transform: translateY(-1px);
        }

        .reason-map-layer-roller.is-nothing {
            border-color: rgba(171, 255, 211, 0.32);
            background:
                radial-gradient(circle at 50% 12%, rgba(171, 255, 211, 0.2), transparent 42%),
                linear-gradient(180deg, rgba(20, 84, 55, 0.88), rgba(6, 45, 29, 0.96)),
                linear-gradient(135deg, rgba(255,255,255,0.1), rgba(255,255,255,0));
            box-shadow:
                inset 0 1px 0 rgba(255,255,255,0.16),
                0 0 22px rgba(86, 255, 173, 0.22),
                0 10px 18px rgba(0,0,0,0.18);
        }

        .reason-map-layer-roller.is-nothing::before,
        .reason-map-layer-roller.is-nothing::after {
            opacity: 0.28;
        }

        .reason-map-layer-roller.is-nothing .reason-map-layer-value {
            display: flex;
            align-items: center;
            justify-content: center;
            border-color: rgba(171, 255, 211, 0.34);
            color: #ecfff3;
            font-family: "Trebuchet MS", sans-serif;
            font-size: 0.96rem;
            font-weight: 900;
            letter-spacing: 0.03em;
            text-transform: none;
            background:
                linear-gradient(180deg, rgba(33, 135, 84, 0.96), rgba(13, 74, 48, 0.98)),
                linear-gradient(135deg, rgba(255,255,255,0.16), rgba(255,255,255,0));
            box-shadow:
                inset 0 1px 0 rgba(255,255,255,0.2),
                0 4px 0 rgba(5, 40, 24, 0.72);
            transform: none;
        }

        .reason-map-layer-roller.is-nothing .reason-map-layer-value::before {
            content: "✓";
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 18px;
            height: 18px;
            margin-right: 7px;
            border-radius: 999px;
            color: #0b3e28;
            font-size: 0.72rem;
            font-weight: 900;
            background: #ecfff3;
            box-shadow: 0 0 12px rgba(236, 255, 243, 0.42);
        }

        .reason-map-layer-roller.is-nothing .reason-map-layer-value::before {
            content: "\2713";
        }

        @keyframes reason-map-slot-flash {
            0% {
                opacity: 0.52;
                transform: translateY(-2px);
            }
            100% {
                opacity: 1;
                transform: translateY(2px);
            }
        }

        .reason-map-preview {
            width: min(100%, 300px);
            padding: 14px 16px 15px;
            border-radius: 20px;
            border: 1px solid rgba(184, 230, 255, 0.16);
            background:
                linear-gradient(180deg, rgba(11, 50, 101, 0.74), rgba(5, 25, 50, 0.92)),
                linear-gradient(135deg, rgba(255,255,255,0.08), rgba(255,255,255,0));
            box-shadow:
                inset 0 1px 0 rgba(255,255,255,0.08),
                0 12px 20px rgba(0,0,0,0.16);
            text-align: center;
        }

        .reason-map-preview-label {
            margin: 0;
            color: rgba(167, 239, 255, 0.8);
            font-size: 0.68rem;
            font-weight: 900;
            letter-spacing: 0.16em;
            text-transform: uppercase;
        }

        .reason-map-preview-title {
            margin: 0;
            color: var(--gold-soft);
            font-family: "Bahnschrift SemiCondensed", "Trebuchet MS", sans-serif;
            font-size: 1.02rem;
            font-weight: 900;
            letter-spacing: 0.06em;
            text-transform: uppercase;
        }

        .reason-map-preview-mode {
            margin: 8px 0 0;
            color: #f5fbff;
            font-size: 0.9rem;
            font-weight: 700;
            letter-spacing: 0.03em;

        .reason-map-preview-reason {
            display: flex;
            align-items: center;
            min-height: 76px;
            margin: 12px 0 0;
            padding: 14px 16px;
            border: 1px solid rgba(212, 220, 230, 0.22);
            border-radius: 20px;
            color: #f6f9fd;
            font-size: clamp(0.88rem, 1.15vw, 1rem);
            font-weight: 800;
            letter-spacing: 0.05em;
            line-height: 1.2;
            background:
                linear-gradient(180deg, rgba(96, 107, 122, 0.92), rgba(29, 35, 45, 0.98)),
                linear-gradient(135deg, rgba(255,255,255,0.14), rgba(255,255,255,0));
            box-shadow:
                inset 0 1px 0 rgba(255,255,255,0.18),
                0 14px 24px rgba(0,0,0,0.2),
                0 4px 0 rgba(16, 21, 28, 0.82);

        .reason-map-robot-panel {
            width: min(720px, 100%);
            margin: 28px auto 0;
            padding: 18px;
            border: 1px solid rgba(184, 230, 255, 0.18);
            border-radius: 26px;
            background:
                radial-gradient(circle at 18% 18%, rgba(171, 255, 211, 0.12), transparent 30%),
                radial-gradient(circle at 82% 10%, rgba(167, 239, 255, 0.12), transparent 30%),
                linear-gradient(180deg, rgba(11, 50, 101, 0.76), rgba(5, 25, 50, 0.94));
            box-shadow:

                linear-gradient(180deg, rgba(33, 135, 84, 0.82), rgba(13, 74, 48, 0.96)),
                linear-gradient(135deg, rgba(255,255,255,0.16), rgba(255,255,255,0));

                inset 0 1px 0 rgba(255,255,255,0.18),
                0 0 18px rgba(86, 255, 173, 0.2);

            left: 18px;
        }

        .reason-map-robot-eye.is-right {
            right: 18px;
        }

        .reason-map-robot-mouth {
            position: absolute;
            left: 22px;
            right: 22px;

            border-radius: 999px;

        .reason-map-robot-kicker {

        .reason-map-robot-title {

        .reason-map-robot-sliders {
            display: grid;
            gap: 12px;

        .reason-map-robot-slider {
            display: grid;
            grid-template-columns: minmax(92px, 0.45fr) minmax(0, 1fr) 54px;
            gap: 12px;
            align-items: center;
            padding: 12px 14px;
            border: 1px solid rgba(184, 230, 255, 0.14);
            border-radius: 18px;

            user-select: none;

        .reason-map-robot-slider-label,
        .reason-map-robot-value {

            letter-spacing: 0.06em;
            text-transform: uppercase;

        .reason-map-robot-value {

        }

        .reason-map-robot-range {

        @keyframes reason-map-robot-reveal {

                transform: translateY(0) scale(1);

        .reason-map-actions {

                linear-gradient(180deg, rgba(9, 40, 86, 0.94), rgba(5, 24, 50, 0.96)),
                linear-gradient(135deg, rgba(255,255,255,0.12), rgba(255,255,255,0));

        .info-copy {

                linear-gradient(180deg, rgba(9, 43, 88, 0.96), rgba(5, 24, 52, 0.98));

                inset 0 1px 0 rgba(255,255,255,0.12),

            box-shadow:
                inset 0 1px 0 rgba(255,255,255,0.2),
                0 16px 24px rgba(0,0,0,0.22),
                0 3px 0 rgba(3, 21, 46, 0.72),
                0 0 18px rgba(255, 229, 162, 0.16);

        .structured-chaos-tester.is-secondary.is-active {

        .structured-chaos-tester-count {

        .structured-chaos-figure {

            height: 14px;

            border-top: 2px solid #ffffff;
            border-left: 2px solid #ffffff;
            border-right: 2px solid #404040;
            border-bottom: 2px solid #404040;
            box-shadow: inset -1px -1px 0 #808080;

        .dtap-input-spacer {

            height: 36px;
            border-radius: 0;
            visibility: hidden;
            pointer-events: none;

            width: 100%;
            height: 36px;
            border-top: 2px solid #ffffff;
            border-left: 2px solid #ffffff;
            border-right: 2px solid #404040;
            border-bottom: 2px solid #404040;
            border-radius: 0;
            cursor: pointer;
            color: #000000;
            font-family: "MS Sans Serif", Tahoma, Verdana, sans-serif;
            font-size: 0.86rem;
            font-weight: 700;
            letter-spacing: 0;

    <script>
        const backButton = document.getElementById('backButton');
        const editModeToggle = document.getElementById('editModeToggle');
        const editModeToggleLabel = document.getElementById('editModeToggleLabel');
        const autoplayToggle = document.getElementById('autoplayToggle');
        const narrationButton = document.getElementById('narrationButton');
        const viewTitle = document.getElementById('viewTitle');
        const viewBreadcrumb = document.getElementById('viewBreadcrumb');
        const overviewContent = document.getElementById('overviewContent');
        const EDIT_MODE_STORAGE_KEY = 'testoverview-edit-mode-v1';
        const CUSTOM_OVERVIEW_STORAGE_KEY = 'testoverview-custom-overview-v1';
        const DTAP_THEME_STORAGE_KEY = 'testoverview-dtap-theme-v1';
        const DTAP_STAGE_STORAGE_KEY = 'testoverview-dtap-stage-v1';
        const NARRATION_AUTOPLAY_STORAGE_KEY = 'testoverview-narration-autoplay-v1';
        const ANALYTICS_VISITOR_STORAGE_KEY = 'testoverview-analytics-visitor-v1';
        const ANALYTICS_SESSION_STORAGE_KEY = 'testoverview-analytics-session-v1';
        const ANALYTICS_SESSION_STARTED_STORAGE_KEY = 'testoverview-analytics-started-v1';
        const ANALYTICS_SEQUENCE_STORAGE_KEY = 'testoverview-analytics-sequence-v1';
        const ANALYTICS_ENDPOINT = 'testoverview-track.php';
        const ANALYTICS_APPLICATION_KEY = 'test_overview';
        const ANALYTICS_BATCH_SIZE = 25;
        const ANALYTICS_FLUSH_DELAY_MS = 800;
        const ANALYTICS_HEARTBEAT_INTERVAL_MS = 30000;
        const ANALYTICS_HEARTBEAT_MAX_DELTA_SECONDS = 45;
        const ANALYTICS_DASHBOARD_TOKEN_STORAGE_KEY = 'testoverview-dashboard-token-v1';
        const ANALYTICS_DASHBOARD_HOLD_MS = 5000;
        const supportsSpeechSynthesis = typeof window !== 'undefined'
            && 'speechSynthesis' in window
            && typeof window.SpeechSynthesisUtterance === 'function';
        const INTRO_GUIDE_FADE_DELAY_MS = 15000;
        const DEEP_LINK_NAVIGATOR_FADE_DELAY_MS = 5000;
        const EDIT_MODE_INTRO_FADE_DELAY_MS = 10000;
        const GA4_MEASUREMENT_ID = window.testOverviewGa4MeasurementId || 'G-NQ7JFWBNXP';
        const GA4_TRACKING_ENABLED = Boolean(window.testOverviewGa4Enabled && typeof window.gtag === 'function');
        const GA4_EVENT_NAME_MAP = Object.freeze({
            click: 'testoverview_click',
            control_change: 'testoverview_control_change',
            audio_start: 'testoverview_audio_start',
            audio_pause: 'testoverview_audio_pause',
            audio_resume: 'testoverview_audio_resume',
            audio_stop: 'testoverview_audio_stop',
            audio_complete: 'testoverview_audio_complete',
            audio_error: 'testoverview_audio_error',
            audio_autoplay_toggle: 'testoverview_autoplay_toggle'
        });

        let activeNarrationText = '';
        let narrationVoicesPromise = null;
        let narrationPlaybackToken = 0;
        let narrationState = 'idle';
        let continueNarrationPlayback = null;
        let narrationAnalyticsPlayback = null;

        const analyticsCanSend = window.location.protocol !== 'file:'
            && !window.location.pathname.toLowerCase().endsWith('.html');
        let analyticsRuntimeEnabled = analyticsCanSend;
        let analyticsQueue = [];
        let analyticsFlushTimer = null;
        let analyticsRequestInFlight = false;
        let analyticsRetryDelayMs = 0;
        let analyticsLastError = '';
        let analyticsLastRenderedViewKey = null;
        let analyticsHeartbeatTimer = null;
        let analyticsActivePeriodStartedAt = document.visibilityState === 'visible' ? Date.now() : null;
        let ga4LastPageLocation = GA4_TRACKING_ENABLED ? window.location.href : '';

        function createAnalyticsId() {
            if (window.crypto && typeof window.crypto.randomUUID === 'function') {
                return window.crypto.randomUUID();
            }
            return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, (character) => {
                const randomValue = Math.floor(Math.random() * 16);
                const value = character === 'x' ? randomValue : ((randomValue & 0x3) | 0x8);
                return value.toString(16);
            });
        }

        function getStoredAnalyticsValue(storage, key, fallbackFactory) {
            try {
                const storedValue = storage.getItem(key);
                if (storedValue) {
                    return storedValue;
                }
                const newValue = fallbackFactory();
                storage.setItem(key, newValue);
                return newValue;
            } catch (error) {
                return fallbackFactory();
            }
        }

        const analyticsVisitorId = getStoredAnalyticsValue(
            window.localStorage,
            ANALYTICS_VISITOR_STORAGE_KEY,
            createAnalyticsId
        );
        const analyticsSessionId = getStoredAnalyticsValue(
            window.sessionStorage,
            ANALYTICS_SESSION_STORAGE_KEY,
            createAnalyticsId
        );
        const analyticsSessionStartedAt = getStoredAnalyticsValue(
            window.sessionStorage,
            ANALYTICS_SESSION_STARTED_STORAGE_KEY,
            () => new Date().toISOString()
        );
        let analyticsEventSequence = (() => {
            try {
                return Math.max(0, Number(window.sessionStorage.getItem(ANALYTICS_SEQUENCE_STORAGE_KEY)) || 0);
            } catch (error) {
                return 0;
            }
        })();

        function analyticsText(value, maximumLength = 255) {
            return String(value || '')
                .replace(/\s+/g, ' ')
                .trim()
                .slice(0, maximumLength);
        }

        function analyticsSlug(value) {
            return analyticsText(value, 120)
                .toLowerCase()
                .replace(/[^a-z0-9]+/g, '-')
                .replace(/^-+|-+$/g, '')
                .slice(0, 100);
        }

        function getAnalyticsDeviceType() {
            if (window.innerWidth <= 640) return 'mobile';
            if (window.innerWidth <= 1024) return 'tablet';
            return 'desktop';
        }

        function consumeAnalyticsActiveSeconds(continueTracking) {
            const now = Date.now();
            if (analyticsActivePeriodStartedAt === null) {
                analyticsActivePeriodStartedAt = continueTracking ? now : null;
                return 0;
            }
            const elapsedSeconds = Math.max(0, Math.round((now - analyticsActivePeriodStartedAt) / 1000));
            analyticsActivePeriodStartedAt = continueTracking ? now : null;
            return Math.min(elapsedSeconds, ANALYTICS_HEARTBEAT_MAX_DELTA_SECONDS);
        }

        function getAnalyticsPageValue() {
            return analyticsText(new URLSearchParams(window.location.search).get('value') || '', 120);
        }

        function getAnalyticsReferrerPath() {
            if (!document.referrer) {
                return '';
            }
            try {
                const referrerUrl = new URL(document.referrer);
                return referrerUrl.origin === window.location.origin
                    ? `${referrerUrl.pathname}${referrerUrl.search}`
                    : referrerUrl.origin;
            } catch (error) {
                return '';
            }
        }

        function getAnalyticsHref(element) {
            if (!(element instanceof HTMLAnchorElement) || !element.href) {
                return '';
            }
            try {
                const url = new URL(element.href, window.location.href);
                return url.origin === window.location.origin
                    ? `${url.pathname}${url.search}`
                    : `${url.origin}${url.pathname}`;
            } catch (error) {
                return '';
            }
        }

        function cleanGa4Parameters(parameters) {
            return Object.fromEntries(Object.entries(parameters).filter(([, value]) => (
                value !== undefined
                && value !== null
                && value !== ''
            )));
        }

        function sendGa4Event(eventName, parameters = {}) {
            if (!GA4_TRACKING_ENABLED) {
                return;
            }
            window.gtag('event', eventName, {
                send_to: GA4_MEASUREMENT_ID,
                ...cleanGa4Parameters(parameters)
            });
        }

        function getGa4PageFile() {
            const pageFile = window.location.pathname.split('/').filter(Boolean).pop();
            return pageFile || 'index';
        }

        function recordGa4VirtualPageView(viewKey) {
            if (!GA4_TRACKING_ENABLED || !overviewTree[viewKey]) {
                return;
            }
            const view = getViewDefinition(viewKey) || overviewTree.root;
            const url = new URL(window.location.href);
            const pageLocation = url.toString();
            if (ga4LastPageLocation === pageLocation) {
                return;
            }
            ga4LastPageLocation = pageLocation;

            sendGa4Event('page_view', {
                page_title: `Test Overview - ${analyticsText(view.title || viewKey, 100)}`,
                page_location: pageLocation,
                page_path: `${url.pathname}${url.search}`,
                testoverview_view: viewKey,
                testoverview_value: getDeepLinkValue(viewKey),
                testoverview_page_file: getGa4PageFile(),
                testoverview_device: getAnalyticsDeviceType()
            });
        }

        function getFieldGuideCtaKey(details) {
            const elementKey = String(details.element_key || '');
            const elementHref = String(details.element_href || '');
            const ctaKey = String(details.metadata?.ga4_cta || '');
            if (ctaKey === 'more_about_me' || ctaKey === 'try_next_level') {
                return ctaKey;
            }
            if (elementKey === 'field-guide:more-about-me' || elementHref.includes('linkedin.com/in/ing-valentijn-p-b696371')) {
                return 'more_about_me';
            }
            if (elementKey === 'field-guide:try-next-level' || elementHref.includes('breaksoftwaretesting.com')) {
                return 'try_next_level';
            }
            return '';
        }

        function recordGa4InteractionEvent(eventType, details = {}) {
            const eventName = GA4_EVENT_NAME_MAP[eventType];
            if (!eventName) {
                return;
            }
            sendGa4Event(eventName, {
                view_key: details.view_key || getCurrentViewKey(),
                previous_view_key: details.previous_view_key,
                target_view_key: details.target_view_key,
                page_value: details.page_value || getAnalyticsPageValue(),
                page_path: details.page_path || window.location.pathname,
                testoverview_page_file: getGa4PageFile(),
                element_kind: details.element_kind,
                element_key: details.element_key,
                element_label: details.element_label,
                element_href: details.element_href,
                pointer_type: details.pointer_type,
                device_type: details.device_type || getAnalyticsDeviceType(),
                audio_source: details.audio_source,
                audio_listened_ms: details.audio_listened_ms,
                audio_autoplay_enabled: details.audio_autoplay_enabled,
                cta_key: details.metadata?.ga4_cta
            });
            const fieldGuideCtaKey = eventType === 'click' ? getFieldGuideCtaKey(details) : '';
            if (fieldGuideCtaKey) {
                sendGa4Event('field_guide_cta_click', {
                    cta_key: fieldGuideCtaKey,
                    cta_label: details.element_label,
                    outbound_url: details.element_href,
                    view_key: details.view_key || getCurrentViewKey(),
                    page_value: details.page_value || getAnalyticsPageValue(),
                    page_path: details.page_path || window.location.pathname,
                    testoverview_page_file: getGa4PageFile(),
                    device_type: details.device_type || getAnalyticsDeviceType()
                });

        }

        function scheduleAnalyticsFlush() {
            if (!analyticsRuntimeEnabled || analyticsFlushTimer || analyticsRequestInFlight) {
                return;
            }
            analyticsFlushTimer = window.setTimeout(() => {
                analyticsFlushTimer = null;
                flushAnalyticsEvents();
            }, Math.max(ANALYTICS_FLUSH_DELAY_MS, analyticsRetryDelayMs));
        }

        async function flushAnalyticsEvents(useBeacon = false) {
            if (!analyticsRuntimeEnabled || (!useBeacon && analyticsRequestInFlight) || analyticsQueue.length === 0) {
                return;
            }

            if (analyticsFlushTimer) {
                window.clearTimeout(analyticsFlushTimer);
                analyticsFlushTimer = null;
            }

            const batch = analyticsQueue.splice(0, ANALYTICS_BATCH_SIZE);
            const body = JSON.stringify({ schema_version: 1, events: batch });
            if (useBeacon && typeof window.navigator.sendBeacon === 'function') {
                const queued = window.navigator.sendBeacon(
                    ANALYTICS_ENDPOINT,
                    new Blob([body], { type: 'application/json' })
                );
                if (!queued) {
                    analyticsQueue.unshift(...batch);
                }
                return;
            }

            analyticsRequestInFlight = true;
            try {
                const response = await window.fetch(ANALYTICS_ENDPOINT, {
                    method: 'POST',
                    credentials: 'same-origin',
                    keepalive: true,
                    headers: { 'Content-Type': 'application/json' },
                    body
                });
                if (!response.ok) {
                    throw new Error(`Analytics endpoint returned HTTP ${response.status}.`);
                }
                analyticsRetryDelayMs = 0;
                analyticsLastError = '';
            } catch (error) {
                analyticsQueue.unshift(...batch);
                analyticsQueue = analyticsQueue.slice(0, 100);
                analyticsLastError = analyticsText(error && error.message, 180)
                    || 'Analytics request failed.';
                analyticsRetryDelayMs = analyticsRetryDelayMs === 0
                    ? 5000
                    : Math.min(analyticsRetryDelayMs * 2, 60000);
            } finally {
                analyticsRequestInFlight = false;
                if (analyticsQueue.length > 0) {
                    scheduleAnalyticsFlush();
                }
            }
        }

        function recordAnalyticsEvent(eventType, details = {}) {
            if (!analyticsRuntimeEnabled) {
                return null;
            }

            analyticsEventSequence += 1;
            try {
                window.sessionStorage.setItem(ANALYTICS_SEQUENCE_STORAGE_KEY, String(analyticsEventSequence));
            } catch (error) {
                // Storage can be unavailable in privacy-focused browser modes.
            }

            const event = {
                session_id: analyticsSessionId,
                visitor_id: analyticsVisitorId,
                session_started_at: analyticsSessionStartedAt,
                event_sequence: analyticsEventSequence,
                application_key: ANALYTICS_APPLICATION_KEY,
                event_type: eventType,
                client_occurred_at: new Date().toISOString(),
                view_key: details.view_key || '',
                previous_view_key: details.previous_view_key || '',
                target_view_key: details.target_view_key || '',
                page_path: window.location.pathname,
                page_value: getAnalyticsPageValue(),
                referrer_path: getAnalyticsReferrerPath(),
                element_kind: details.element_kind || '',
                element_key: details.element_key || '',
                element_id: details.element_id || '',
                element_label: details.element_label || '',
                element_classes: details.element_classes || '',
                element_href: details.element_href || '',
                pointer_type: details.pointer_type || '',
                click_x: details.click_x ?? null,
                click_y: details.click_y ?? null,
                viewport_width: Math.max(0, Math.round(window.innerWidth)),
                viewport_height: Math.max(0, Math.round(window.innerHeight)),
                device_type: getAnalyticsDeviceType(),
                active_seconds_delta: Math.max(0, Math.round(Number(details.active_seconds_delta) || 0)),
                audio_source: details.audio_source || '',
                audio_listened_ms: details.audio_listened_ms ?? null,
                audio_autoplay_enabled: typeof details.audio_autoplay_enabled === 'boolean'
                    ? details.audio_autoplay_enabled
                    : null,
                metadata: details.metadata || {}
            };
            recordGa4InteractionEvent(eventType, event);
            analyticsQueue.push(event);
            if (analyticsQueue.length >= ANALYTICS_BATCH_SIZE && analyticsRetryDelayMs === 0) {
                flushAnalyticsEvents();
            } else {
                scheduleAnalyticsFlush();
            }
            return event;
        }

        function recordAnalyticsView(viewKey) {
            if (!analyticsRuntimeEnabled) {
                return;

            if (analyticsLastRenderedViewKey === null) {
                recordAnalyticsEvent('page_view', {
                    view_key: viewKey,
                    target_view_key: viewKey
                });
            } else if (analyticsLastRenderedViewKey !== viewKey) {
                recordAnalyticsEvent('view_change', {

                    previous_view_key: analyticsLastRenderedViewKey,
                    target_view_key: viewKey

        function getAnalyticsInteractiveElement(target) {
            if (!(target instanceof Element)) {
                return null;

            return target.closest([
                'button',
                'a',
                'summary',
                'input[type="button"]',
                'input[type="submit"]',
                'input[type="range"]',
                'input[type="checkbox"]',
                'input[type="radio"]',
                'select',
                '[role="button"]',
                '[data-track-id]'
            ].join(','));
        }

        function getAnalyticsElementDetails(element) {
            const label = analyticsText(
                element.dataset.trackLabel
                    || element.getAttribute('aria-label')
                    || element.getAttribute('title')
                    || element.textContent,
                255
            );
            const elementKind = element.tagName.toLowerCase();
            const elementKey = analyticsText(
                element.dataset.trackId
                    || element.id
                    || element.dataset.trackTarget
                    || getAnalyticsHref(element)
                    || `${elementKind}:${analyticsSlug(label)}`,
                160
            );
            return {
                element_kind: elementKind,
                element_key: elementKey,
                element_id: analyticsText(element.id, 120),

                element_classes: analyticsText(Array.from(element.classList).join(' '), 255),
                element_href: analyticsText(getAnalyticsHref(element), 512)

        function handleAnalyticsClick(event) {
            const element = getAnalyticsInteractiveElement(event.target);
            if (!element || element.matches(':disabled') || element.getAttribute('aria-disabled') === 'true') {
                return;
            }

            const sourceViewKey = getCurrentViewKey();
            const analyticsEvent = recordAnalyticsEvent('click', {
                ...getAnalyticsElementDetails(element),
                view_key: sourceViewKey,
                target_view_key: analyticsText(element.dataset.trackTarget, 120),
                pointer_type: event.detail === 0 ? 'keyboard' : analyticsText(event.pointerType || 'mouse', 20),
                click_x: Math.max(0, Math.round(event.clientX || 0)),
                click_y: Math.max(0, Math.round(event.clientY || 0)),
                metadata: {
                    ga4_cta: analyticsText(element.dataset.ga4Cta, 60),
                    track_external: analyticsText(element.dataset.trackExternal, 80)
                }
            });

            if (analyticsEvent) {
                window.setTimeout(() => {
                    const resultingViewKey = getCurrentViewKey();
                    if (resultingViewKey !== sourceViewKey) {
                        analyticsEvent.target_view_key = resultingViewKey;
                    }
                    if (element.dataset.trackExternal) {
                        flushAnalyticsEvents();
                    }
                }, 0);
            }

        function handleAnalyticsControlChange(event) {
            const element = event.target;
            if (!(element instanceof HTMLInputElement || element instanceof HTMLSelectElement)) {
                return;
            }
            if (element instanceof HTMLInputElement
                && !['range', 'checkbox', 'radio'].includes(element.type)) {
                return;
            }

            const metadata = {};
            if (element instanceof HTMLInputElement && element.type === 'range') {
                metadata.range_value = Number(element.value);
                metadata.range_min = Number(element.min || 0);
                metadata.range_max = Number(element.max || 100);
            } else if (element instanceof HTMLInputElement) {
                metadata.checked = element.checked;
            } else {
                metadata.selected_index = element.selectedIndex;
            }

            recordAnalyticsEvent('control_change', {
                ...getAnalyticsElementDetails(element),
                view_key: getCurrentViewKey(),
                pointer_type: 'unknown',
                metadata
            });
        }

        function makeSafeCustomLabel(value) {
            return String(value || '')
                .replace(/\s+/g, ' ')
                .trim()
                .slice(0, 80);
        }

        function normalizeCustomOverviewState(raw) {
            const state = {
                views: {},
                links: {}
            };

            if (!raw || typeof raw !== 'object') {
                return state;
            }

            const rawViews = raw.views && typeof raw.views === 'object' ? raw.views : {};
            Object.entries(rawViews).forEach(([viewKey, viewValue]) => {
                if (typeof viewKey !== 'string' || !viewValue || typeof viewValue !== 'object') {
                    return;
                }
                const title = makeSafeCustomLabel(viewValue.title || 'Custom page');
                if (!title) {
                    return;
                }
                state.views[viewKey] = {
                    title,
                    createdAt: typeof viewValue.createdAt === 'string' ? viewValue.createdAt : new Date().toISOString()
                };
            });

            const rawLinks = raw.links && typeof raw.links === 'object' ? raw.links : {};
            Object.entries(rawLinks).forEach(([pageKey, pageLinks]) => {
                if (typeof pageKey !== 'string' || !Array.isArray(pageLinks)) {
                    return;
                }
                const normalizedLinks = pageLinks
                    .map((entry) => {
                        if (!entry || typeof entry !== 'object') {
                            return null;
                        }
                        const label = makeSafeCustomLabel(entry.label);
                        const target = typeof entry.target === 'string' ? entry.target : '';
                        if (!label || !target) {
                            return null;
                        }
                        return {
                            id: typeof entry.id === 'string' ? entry.id : `custom-link-${Date.now().toString(36)}`,
                            label,
                            target,
                            createdAt: typeof entry.createdAt === 'string' ? entry.createdAt : new Date().toISOString()
                        };
                    })
                    .filter((entry) => entry && state.views[entry.target]);

                if (normalizedLinks.length) {
                    state.links[pageKey] = normalizedLinks;
                }
            });

            return state;
        }

        function createCustomViewKey() {
            return `custom-${Date.now().toString(36)}-${Math.random().toString(36).slice(2, 8)}`;
        }

        function isCustomViewKey(viewKey) {
            return Boolean(customOverviewState.views[viewKey]) && !overviewTree[viewKey];
        }

        function getCustomButtonsForView(viewKey) {
            return Array.isArray(customOverviewState.links[viewKey]) ? customOverviewState.links[viewKey] : [];
        }

        function createCustomButtonForView(viewKey, rawLabel) {
            const label = makeSafeCustomLabel(rawLabel);
            if (!label) {
                return null;
            }

            const target = createCustomViewKey();
            const nowIso = new Date().toISOString();
            customOverviewState.views[target] = {
                title: label,
                createdAt: nowIso
            };

            if (!Array.isArray(customOverviewState.links[viewKey])) {
                customOverviewState.links[viewKey] = [];
            }

            customOverviewState.links[viewKey].push({
                id: `custom-link-${Date.now().toString(36)}-${Math.random().toString(36).slice(2, 7)}`,
                label,
                target,
                createdAt: nowIso
            });

            saveCustomOverviewState();
            return target;
        }

        function accumulateNarrationListenedTime() {
            if (!narrationAnalyticsPlayback || narrationAnalyticsPlayback.activeStartedAt === null) {
                return;

            narrationAnalyticsPlayback.listenedMs += Math.max(
                0,
                window.performance.now() - narrationAnalyticsPlayback.activeStartedAt
            );
            narrationAnalyticsPlayback.activeStartedAt = null;
        }

        function beginNarrationAnalytics(source, text) {
            narrationAnalyticsPlayback = {
                source: source === 'autoplay' ? 'autoplay' : 'manual',
                viewKey: getCurrentViewKey(),
                listenedMs: 0,
                activeStartedAt: window.performance.now()
            };
            recordAnalyticsEvent('audio_start', {
                view_key: narrationAnalyticsPlayback.viewKey,
                audio_source: narrationAnalyticsPlayback.source,
                audio_listened_ms: 0,
                audio_autoplay_enabled: isNarrationAutoplayEnabled,
                metadata: {
                    character_count: String(text || '').length,
                    word_count: String(text || '').trim().split(/\s+/).filter(Boolean).length
                }
            });
        }

        function recordNarrationProgress(eventType, reason = '') {
            if (!narrationAnalyticsPlayback) {
                return;
            }
            accumulateNarrationListenedTime();
            recordAnalyticsEvent(eventType, {
                view_key: narrationAnalyticsPlayback.viewKey,
                audio_source: narrationAnalyticsPlayback.source,
                audio_listened_ms: Math.max(0, Math.round(narrationAnalyticsPlayback.listenedMs)),
                audio_autoplay_enabled: isNarrationAutoplayEnabled,
                metadata: reason ? { reason } : {}
            });
        }

        function finishNarrationAnalytics(eventType, reason) {
            if (!narrationAnalyticsPlayback) {
                return;
            }
            recordNarrationProgress(eventType, reason);
            narrationAnalyticsPlayback = null;
        }

        function stopNarration(reason = 'interrupted') {
            finishNarrationAnalytics('audio_stop', reason);
            continueNarrationPlayback = null;
            narrationState = 'idle';

            if (supportsSpeechSynthesis) {
                narrationPlaybackToken += 1;
                window.speechSynthesis.cancel();
            }

            applyNarrationButtonState();
        }

        function pauseNarration() {
            if (!supportsSpeechSynthesis || narrationState !== 'playing') return;
            recordNarrationProgress('audio_pause', 'user');
            narrationState = 'paused';

            if (window.speechSynthesis.speaking && !window.speechSynthesis.paused) {
                window.speechSynthesis.pause();
            }

            applyNarrationButtonState();
        }

        function resumeNarration() {
            if (!supportsSpeechSynthesis || narrationState !== 'paused') return;
            narrationState = 'playing';
            if (narrationAnalyticsPlayback) {
                narrationAnalyticsPlayback.activeStartedAt = window.performance.now();
                recordAnalyticsEvent('audio_resume', {
                    view_key: narrationAnalyticsPlayback.viewKey,
                    audio_source: narrationAnalyticsPlayback.source,
                    audio_listened_ms: Math.max(0, Math.round(narrationAnalyticsPlayback.listenedMs)),
                    audio_autoplay_enabled: isNarrationAutoplayEnabled
                });
            }
            applyNarrationButtonState();

            if (window.speechSynthesis.paused) {
                window.speechSynthesis.resume();
                return;
            }

            if (typeof continueNarrationPlayback === 'function') {
                window.setTimeout(() => {
                    if (narrationState === 'playing' && typeof continueNarrationPlayback === 'function') {
                        continueNarrationPlayback();
                    }

        }

        function waitForNarrationVoices(timeoutMs = 2200) {
            if (!supportsSpeechSynthesis) {
                return Promise.resolve([]);
            }

            if (typeof window.speechSynthesis.getVoices !== 'function') {
                return Promise.resolve([]);
            }

            const existingVoices = window.speechSynthesis.getVoices();
            if (existingVoices.length) {
                return Promise.resolve(existingVoices);
            }

            if (narrationVoicesPromise) {
                return narrationVoicesPromise;
            }

            narrationVoicesPromise = new Promise((resolve) => {
                const finish = () => {
                    const voices = window.speechSynthesis.getVoices();
                    narrationVoicesPromise = null;
                    resolve(voices);
                };

                const timer = window.setTimeout(finish, timeoutMs);
                if (typeof window.speechSynthesis.addEventListener === 'function') {
                    window.speechSynthesis.addEventListener('voiceschanged', () => {
                        window.clearTimeout(timer);
                        finish();
                    }, { once: true });
                }

                window.speechSynthesis.getVoices();
            });

            return narrationVoicesPromise;
        }

        function getEnglishNarrationVoice(voices = []) {
            if (!supportsSpeechSynthesis) return null;
            if (!voices.length) return null;

            const preferredVoiceNames = [
                'Microsoft Aria Online (Natural)',
                'Microsoft Jenny Online (Natural)',
                'Microsoft Libby Online (Natural)',
                'Aria Online',
                'Jenny Online',
                'Libby Online',
                'Aria',
                'Jenny',
                'Libby',
                'Emma',
                'Ava',
                'Sonia',
                'Michelle',
                'Zira',
                'Hazel',
                'Susan',
                'Google UK English Female',
                'Google US English',
                'Female'
            ];

            const englishVoices = voices.filter((voice) => typeof voice.lang === 'string' && voice.lang.toLowerCase().startsWith('en'));
            if (!englishVoices.length) {
                return null;
            }

            const scoreVoice = (voice) => {
                const name = (voice.name || '').toLowerCase();
                let score = 0;

                preferredVoiceNames.forEach((preferredName, index) => {
                    if (name.includes(preferredName.toLowerCase())) {
                        score += 400 - (index * 10);
                    }
                });

                if (voice.lang === 'en-US') score += 60;
                if (voice.lang === 'en-GB') score += 55;
                if (voice.default) score += 20;
                if (name.includes('natural')) score += 140;
                if (name.includes('online')) score += 100;
                if (name.includes('neural')) score += 120;
                if (name.includes('premium')) score += 60;
                if (name.includes('female')) score += 120;
                if (name.includes('male')) score -= 120;
                if (name.includes('david') || name.includes('guy') || name.includes('mark')) score -= 60;

                return score;
            };

            return englishVoices
                .slice()
                .sort((left, right) => scoreVoice(right) - scoreVoice(left))[0] || null;
        }

        function updateNarrationButton(view) {

        function splitNarrationText(text) {
            return String(text || '')
                .split(/(?<=[.!?])\s+/)
                .map((segment) => segment.trim())
                .filter(Boolean);
        }

        async function playNarration(text, source = 'manual') {
            if (!supportsSpeechSynthesis || !text) return;

            stopNarration('restarted');
            const playbackToken = narrationPlaybackToken + 1;
            narrationPlaybackToken = playbackToken;

            narrationState = 'playing';
            applyNarrationButtonState();

            const voices = await waitForNarrationVoices();
            if (playbackToken !== narrationPlaybackToken) {
                return;
            }

            const voice = getEnglishNarrationVoice(voices);
            const segments = splitNarrationText(text);
            if (!segments.length) {
                continueNarrationPlayback = null;
                narrationState = 'idle';
                applyNarrationButtonState();
                return;
            }

            const isNaturalVoice = Boolean(voice && /natural|online|neural/i.test(voice.name || ''));
            const playbackRate = isNaturalVoice ? 0.98 : 0.9;
            const playbackPitch = isNaturalVoice ? 1.03 : 1.08;

            let segmentIndex = 0;
            beginNarrationAnalytics(source, text);

            const speakNextSegment = () => {
                if (playbackToken !== narrationPlaybackToken) {
                    return;
                }

                continueNarrationPlayback = speakNextSegment;

                if (narrationState === 'paused') {
                    return;
                }

                if (segmentIndex >= segments.length) {
                    finishNarrationAnalytics('audio_complete', 'completed');
                    continueNarrationPlayback = null;
                    narrationState = 'idle';
                    applyNarrationButtonState();
                    return;
                }

                const utterance = new SpeechSynthesisUtterance(segments[segmentIndex]);
                utterance.lang = voice?.lang || 'en-US';
                utterance.rate = playbackRate;
                utterance.pitch = playbackPitch;
                utterance.volume = 1;

                if (voice) {
                    utterance.voice = voice;
                }

                utterance.onend = () => {
                    if (playbackToken !== narrationPlaybackToken) {
                        return;
                    }
                    segmentIndex += 1;
                    window.setTimeout(() => {
                        if (playbackToken !== narrationPlaybackToken) {
                            return;
                        }
                        if (narrationState === 'paused') {
                            continueNarrationPlayback = speakNextSegment;
                            return;
                        }
                        speakNextSegment();
                    }, 110);
                };

                utterance.onerror = () => {
                    if (playbackToken !== narrationPlaybackToken) {
                        return;
                    }
                    continueNarrationPlayback = null;
                    finishNarrationAnalytics('audio_error', 'speech_synthesis_error');
                    narrationState = 'idle';
                    applyNarrationButtonState();
                };

                window.speechSynthesis.speak(utterance);
            };

            speakNextSegment();
        }

        function maybeAutoplayNarration(view, viewKey) {

        function playDashboardBootLaserSequence() {
            const audioContext = getOverviewAudioContext();
            if (!audioContext) return;

            const now = audioContext.currentTime + 0.01;
            const masterGain = audioContext.createGain();
            const compressor = audioContext.createDynamicsCompressor();
            dashboardEntrySequenceEndsAt = Date.now() + 6200;

            compressor.threshold.setValueAtTime(-20, now);
            compressor.knee.setValueAtTime(16, now);
            compressor.ratio.setValueAtTime(5, now);
            compressor.attack.setValueAtTime(0.004, now);
            compressor.release.setValueAtTime(0.3, now);
            masterGain.gain.setValueAtTime(0.0001, now);
            masterGain.gain.exponentialRampToValueAtTime(0.28, now + 0.045);
            masterGain.gain.setValueAtTime(0.28, now + 5.15);
            masterGain.gain.exponentialRampToValueAtTime(0.0001, now + 6.05);
            masterGain.connect(compressor);
            compressor.connect(audioContext.destination);

            const connectWithPan = (source, gain, panValue = 0) => {
                source.connect(gain);
                if (typeof audioContext.createStereoPanner === 'function') {
                    const panner = audioContext.createStereoPanner();
                    panner.pan.setValueAtTime(panValue, now);
                    gain.connect(panner);
                    panner.connect(masterGain);
                    return panner;
                }
                gain.connect(masterGain);
                return null;
            };

            // Sub pressure makes the entry feel physical before the brighter effects arrive.
            const pressure = audioContext.createOscillator();
            const pressureGain = audioContext.createGain();
            const pressureFilter = audioContext.createBiquadFilter();
            pressure.type = 'sawtooth';
            pressure.frequency.setValueAtTime(31, now);
            pressure.frequency.exponentialRampToValueAtTime(48, now + 2.4);
            pressure.frequency.exponentialRampToValueAtTime(27, now + 5.8);
            pressureFilter.type = 'lowpass';
            pressureFilter.frequency.setValueAtTime(130, now);
            pressureFilter.frequency.exponentialRampToValueAtTime(260, now + 3.8);
            pressureGain.gain.setValueAtTime(0.0001, now);
            pressureGain.gain.exponentialRampToValueAtTime(0.34, now + 0.22);
            pressureGain.gain.setValueAtTime(0.34, now + 4.8);
            pressureGain.gain.exponentialRampToValueAtTime(0.0001, now + 6);
            pressure.connect(pressureFilter);
            pressureFilter.connect(pressureGain);
            pressureGain.connect(masterGain);
            pressure.start(now);
            pressure.stop(now + 6.08);

            // Filtered noise and metal harmonics create two heavy doors sliding apart.
            const doorBuffer = audioContext.createBuffer(1, Math.floor(audioContext.sampleRate * 2.8), audioContext.sampleRate);
            const doorData = doorBuffer.getChannelData(0);

            [
